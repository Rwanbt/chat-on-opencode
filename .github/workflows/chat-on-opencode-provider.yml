name: Chat On OpenCode Provider

on:
  pull_request:
    paths:
      - 'packages/opencode-provider/**'
      - '.github/workflows/chat-on-opencode-provider.yml'
      - 'electron-builder.provider.yml'
      - 'scripts/package.mjs'
      - 'scripts/smoke-packaged-runtime.mjs'
      - 'scripts/provider-isolated-profile.ts'
      - 'scripts/verify-provider-packaged-electron.mjs'
      - 'scripts/provider-window-probe-runner.mjs'
      - 'scripts/verify-official-desktop-bundle.ps1'
      - 'scripts/probe-official-desktop-window.ps1'
      - 'test/provider-official-desktop-gui.e2e.mjs'
      - 'test/provider-window-probe-runner.test.mjs'
      - 'test/provider-additive-busy-process-exclusive.test.mjs'
      - 'scripts/verify-provider-packaged-sign-in.mjs'
      - 'test/provider-packaged-gateway-env.e2e.mjs'
      - 'test/provider-official-cli-packaged.e2e.mjs'
      - 'test/provider-official-cli-free-switch.e2e.mjs'
      - 'scripts/provider-windows-window-probe.ps1'
      - 'package.json'
      - 'test/provider-packaging.test.ts'
      - 'src/main/index.ts'
      - 'src/main/provider-service.ts'
      - 'src/main/cos-browser/**'
      - 'extension/**'
      - 'test/provider-bridge-isolation.test.mjs'
      - 'test/provider-hidden-bootstrap.test.mjs'
  push:
    branches: [main, feat/opencode-v2-provider-bridge]
    paths:
      - 'packages/opencode-provider/**'
      - '.github/workflows/chat-on-opencode-provider.yml'
      - 'electron-builder.provider.yml'
      - 'scripts/package.mjs'
      - 'scripts/smoke-packaged-runtime.mjs'
      - 'scripts/provider-isolated-profile.ts'
      - 'scripts/verify-provider-packaged-electron.mjs'
      - 'scripts/verify-provider-packaged-sign-in.mjs'
      - 'scripts/provider-windows-window-probe.ps1'
      - 'package.json'
      - 'test/provider-packaging.test.ts'

permissions:
  contents: read

jobs:
  contract:
    name: Node 22 contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/opencode-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax
        run: |
          node --check src/control.mjs
          node --check src/gateway.mjs
          node --check src/server.mjs
      - name: Native protocol tests
        run: npm test

  service-policy:
    name: Isolated service guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Pin isolated bridge and hidden browser lifecycle
        run: node --experimental-strip-types --test test/provider-bridge-isolation.test.mjs test/provider-hidden-bootstrap.test.mjs
      - name: Bounded owned-window probe timeout and refusal tests
        run: node --test test/provider-window-probe-runner.test.mjs
      - name: Service profile and UI isolation policy
        run: bun test packages/opencode-provider/test/provider-service.test.ts
      - name: Exclusive Windows process-safety gate for official opencode.exe
        if: runner.os == 'Windows'
        run: node --test test/provider-additive-busy-process-exclusive.test.mjs
      - name: Provider hook bundles for OpenCode V2
        run: bun build packages/opencode-provider/plugin/index.ts --external '@opencode/plugin' --target bun --outdir packages/opencode-provider/.smoke-build

  native-process:
    name: Offline native process E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Launch isolated processes, prove native turns and parent-death cleanup
        run: node --test packages/opencode-provider/test/native-process.e2e.mjs packages/opencode-provider/test/parent-death.e2e.mjs

  portable-electron:
    name: Native Electron provider service (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Install exact CoS build dependencies
        run: npm ci
      - name: Build independent unpacked provider runtime and probe native modules
        run: npm run dist:provider:win:x64
      - name: RED gate - real packaged gateway under standalone CLI-like environment
        run: node test/provider-packaged-gateway-env.e2e.mjs
      - name: Qualify hidden service and explicit isolated sign-in against packaged Electron
        run: node scripts/verify-provider-packaged-sign-in.mjs
      - name: Install official OpenCode 2.1.4 in runner temp only
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'chat-on-opencode-cli'
          npm install --prefix $prefix --no-save --no-audit --no-fund "@opencode/cli@2.1.4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Official OpenCode 2.1.4 to packaged Electron (unpaired fail-closed)
        shell: pwsh
        run: |
          $env:CHAT_ON_OPENCODE_TEST_CLI = Join-Path $env:RUNNER_TEMP 'chat-on-opencode-cli/node_modules/@opencode/cli/bin/opencode.exe'
          if (-not (Test-Path -LiteralPath $env:CHAT_ON_OPENCODE_TEST_CLI)) { throw 'Official CLI binary missing' }
          node test/provider-official-cli-packaged.e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Official OpenCode 2.1.4 with additive legacy 16k context overlay (real packaged Electron)
        shell: pwsh
        env:
          CHAT_ON_OPENCODE_TEST_LEGACY_OVERLAY: '1'
        run: |
          $env:CHAT_ON_OPENCODE_TEST_CLI = Join-Path $env:RUNNER_TEMP 'chat-on-opencode-cli/node_modules/@opencode/cli/bin/opencode.exe'
          if (-not (Test-Path -LiteralPath $env:CHAT_ON_OPENCODE_TEST_CLI)) { throw 'Official CLI binary missing' }
          node test/provider-official-cli-packaged.e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual PR47 additive CLI install, official 2.1.4 inference refusal, complete rollback
        shell: pwsh
        env:
          CHAT_ON_OPENCODE_TEST_LEGACY_OVERLAY: '1'
          CHAT_ON_OPENCODE_TEST_REAL_ADDITIVE: '1'
        run: |
          $env:CHAT_ON_OPENCODE_TEST_CLI = Join-Path $env:RUNNER_TEMP 'chat-on-opencode-cli/node_modules/@opencode/cli/bin/opencode.exe'
          if (-not (Test-Path -LiteralPath $env:CHAT_ON_OPENCODE_TEST_CLI)) { throw 'Official CLI missing for real additive transaction' }
          node test/provider-official-cli-packaged.e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Official CLI 2.1.4 foreign provider selection preserves native requests and CoS silence
        shell: pwsh
        run: |
          $env:CHAT_ON_OPENCODE_TEST_CLI = Join-Path $env:RUNNER_TEMP 'chat-on-opencode-cli/node_modules/@opencode/cli/bin/opencode.exe'
          if (-not (Test-Path -LiteralPath $env:CHAT_ON_OPENCODE_TEST_CLI)) { throw 'Official CLI binary missing' }
          node test/provider-official-cli-free-switch.e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable provider bundle after runtime smoke
        uses: actions/upload-artifact@v4
        with:
          name: chat-on-opencode-provider-win-x64-${{ github.sha }}
          path: release/provider/
          if-no-files-found: error
          retention-days: 14

  native-opencode-v2:
    name: Actual OpenCode V2 provider turn (Windows x64 offline, CLI ${{ matrix.cli_version }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cli_version: ['2.0.32', '2.1.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install pinned OpenCode CLI ${{ matrix.cli_version }} in runner temp only
        shell: pwsh
        env:
          CHAT_ON_OPENCODE_CLI_VERSION: ${{ matrix.cli_version }}
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'chat-on-opencode-cli'
          npm install --prefix $prefix --no-save --no-audit --no-fund "@opencode/cli@$env:CHAT_ON_OPENCODE_CLI_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute native plugin, gateway and two-process CoS transport
        shell: pwsh
        run: |
          $env:CHAT_ON_OPENCODE_TEST_CLI = Join-Path $env:RUNNER_TEMP 'chat-on-opencode-cli/node_modules/@opencode/cli/bin/opencode.exe'
          if (-not (Test-Path -LiteralPath $env:CHAT_ON_OPENCODE_TEST_CLI)) { throw 'Pinned OpenCode CLI was not installed' }
          node --test --test-concurrency=1 packages/opencode-provider/test/opencode-v2-cli.e2e.mjs packages/opencode-provider/test/opencode-v2-native-read.e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.cli_version }}' -eq '2.1.4') {
            node --test packages/opencode-provider/test/official-native-text.e2e.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  official-desktop:
    name: Official unmodified Desktop 2.1.4 bundled CLI → provider (Windows x64)
    runs-on: windows-2025
    needs: [portable-electron]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: chat-on-opencode-provider-win-x64-${{ github.sha }}
          path: release/provider
      - name: Verify official signed Desktop 2.1.4 and its bundled CLI without running installer
        shell: pwsh
        run: |
          ./scripts/verify-official-desktop-bundle.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline restart-only versioned config pointer through authentic Desktop bundled CLI
        shell: pwsh
        run: |
          $env:CHAT_ON_OPENCODE_TEST_OFFICIAL_CLI = $env:CHAT_ON_OPENCODE_TEST_CLI
          node --test packages/opencode-provider/test/official-immutable-cli.e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundled Desktop CLI 2.1.4 starts real packaged provider Electron (unpaired)
        shell: pwsh
        run: |
          node test/provider-official-cli-packaged.e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundled Desktop CLI 2.1.4 verifies global legacy context overlay without JSONC rewrite
        shell: pwsh
        env:
          CHAT_ON_OPENCODE_TEST_LEGACY_OVERLAY: '1'
        run: |
          node test/provider-official-cli-packaged.e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Desktop bundled official CLI with actual reversible PR47 global overlay installer
        shell: pwsh
        env:
          CHAT_ON_OPENCODE_TEST_LEGACY_OVERLAY: '1'
          CHAT_ON_OPENCODE_TEST_REAL_ADDITIVE: '1'
        run: |
          node test/provider-official-cli-packaged.e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundled Desktop CLI 2.1.4 selects other provider without contacting 8765 or 8766
        shell: pwsh
        run: |
          node test/provider-official-cli-free-switch.e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real official Desktop GUI isolated smoke
        shell: pwsh
        run: |
          node test/provider-official-desktop-gui.e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

